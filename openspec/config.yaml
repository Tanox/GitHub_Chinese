schema: spec-driven

# Project context
context: |
  技术栈: JavaScript (ES6+), TypeScript, Next.js 16, Node.js
  使用语义化提交
  领域: GitHub 中文本地化插件（用户脚本）+ 词典采集工作台
  规范文档: docs/ 目录存放正式规范文档（唯一权威正文）
  设计系统: prototype/ 目录存放设计系统和高保真原型
  当前版本: 1.9.24
  版本单一来源: src/version.js

# Per-artifact rules
rules:
  proposal:
    - 保持提案在500字以内
    - 始终包含'非目标'部分

# Specification directories
specDirectories:
  - path: ../docs
    purpose: 存放正式规范文档（唯一权威正文）
    description: |
      包含开发进度、项目规范、架构、开发指南、代码风格与原型设计等正式文档。
      主要文档：
      - PROGRESS.md: 开发进度与遗留任务清单
      - project.md: 项目概述、目录结构与核心模块
      - architecture.md: 系统架构与采集工作台架构
      - development.md: 开发流程指南
      - coding-style.md: 代码风格规范
      - prototype.md: 原型设计与交互规格
  - path: .
    purpose: OpenSpec 规范索引与配置
    description: |
      本目录仅存放指向 docs/ 权威正文的简短索引与 OpenSpec 配置，
      不重复维护文档正文，避免多副本长期脱节。
