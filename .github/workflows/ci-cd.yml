name: GitHub Chinese CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# 同 ref 并发取消在途作业，保证发布/构建可重复、不互相干扰
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 代码质量检查
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: 安装依赖
      run: npm ci

    - name: 运行 ESLint
      run: npm run lint

    - name: 检查代码格式
      run: npm run format:check

    - name: 检查代码文件行数
      run: npm run lint:length

    - name: 类型检查
      run: npm run typecheck

  # 构建项目（Next 站点 + 用户脚本产物）+ 单元测试 + 产物校验
  build:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: 安装依赖
      run: npm ci

    - name: 构建 Next 站点
      run: npm run build

    - name: 构建用户脚本产物（供后续校验与上传）
      run: npm run build:userscript

    - name: 运行单元测试
      run: npm run test:unit

    - name: 验证构建产物
      run: npm run validate

    - name: 上传用户脚本产物
      uses: actions/upload-artifact@v4
      with:
        name: GitHub_zh-cn.user.js
        path: build/GitHub_zh-cn.user.js
        retention-days: 30

  # 集成测试：真实启动 Next 服务，对 API 路由做真实 HTTP 断言
  integration:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: 安装依赖
      run: npm ci

    - name: 构建 Next 站点（供 next start）
      run: npm run build:web

    - name: 运行集成测试
      run: npm run test:integration

  # 安全扫描
  security:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: 安装依赖
      run: npm ci

    - name: 运行安全审计
      run: npm audit --audit-level=high

  # 自动发布：push main 且 build / integration / security 全绿后自动创建 GitHub Release
  # （push v* tag 亦可触发；tag 版本须与 package.json 一致）
  release:
    runs-on: ubuntu-latest
    needs: [build, integration, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    # 发布不参与按 ref 的并发取消，排队执行，防止连推 main 时丢发布
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: 安装依赖
      run: npm ci

    # 版本号单一来源：package.json == version.js（build 产物内联）== CHANGELOG 顶部
    - name: 解析发布版本号（单一版本源）
      id: version
      run: |
        VERSION=$(node -p "require('./package.json').version")
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "❌ tag v$TAG_VERSION 与 package.json version $VERSION 不一致"; exit 1
          fi
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "本次发布版本: v$VERSION"

    - name: 校验版本一致性（package.json == CHANGELOG 顶部）
      run: node scripts/check-version-consistency.cjs

    # 幂等护栏：该版本 tag 已存在 = 已发布过，直接跳过（发新版本须 bump 版本号）
    - name: 幂等护栏（该版本已发布则跳过）
      id: guard
      run: |
        if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "⏭️ tag v${{ steps.version.outputs.version }} 已存在，该版本已发布，跳过。如需重新发布请 bump 版本号。"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "🚀 v${{ steps.version.outputs.version }} 未发布，继续发布流程"
        fi

    - name: 构建用户脚本产物
      if: steps.guard.outputs.skip == 'false'
      run: npm run build:userscript

    - name: 抽取 Release Notes（从 CHANGELOG 对应版本段落）
      if: steps.guard.outputs.skip == 'false'
      run: node scripts/extract-release-notes.cjs v${{ steps.version.outputs.version }}

    - name: 组装发布包
      if: steps.guard.outputs.skip == 'false'
      run: |
        mkdir -p release
        cp build/GitHub_zh-cn.user.js release/
        cp README.md LICENSE release/ 2>/dev/null || true
        cd release
        zip -r ../GitHub_zh-cn_v${{ steps.version.outputs.version }}.zip .

    # tag 不存在时 action 会在当前 commit 自动创建 v<版本号> tag
    - name: 发布到 GitHub Release
      if: steps.guard.outputs.skip == 'false'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        body_path: release-notes.md
        files: |
          build/GitHub_zh-cn.user.js
          GitHub_zh-cn_v${{ steps.version.outputs.version }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 部署到 GitHub Pages（push main 时）
  deploy-pages:
    runs-on: ubuntu-latest
    needs: [build, integration, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 配置 Pages
      uses: actions/configure-pages@v5

    - name: 上传 Pages 产物
      uses: actions/upload-pages-artifact@v3
      with:
        # 与原 static.yml 行为一致：部署整个仓库到 Pages
        path: '.'

    - name: 部署到 GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

  # 通知
  notify:
    runs-on: ubuntu-latest
    needs: [build, integration, security]
    if: always()
    steps:
    - name: 通知构建结果
      run: |
        if [ "${{ needs.build.result }}" == "success" ] && [ "${{ needs.integration.result }}" == "success" ] && [ "${{ needs.security.result }}" == "success" ]; then
          echo "✅ 构建、集成测试与安全扫描全部通过"
        else
          echo "❌ 存在失败的作业"
          exit 1
        fi
