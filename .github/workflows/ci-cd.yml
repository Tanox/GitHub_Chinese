name: GitHub Chinese CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# 同 ref 并发取消在途作业，保证发布/构建可重复、不互相干扰
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 代码质量检查
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: 安装依赖
      run: npm ci

    - name: 运行 ESLint
      run: npm run lint

    - name: 检查代码格式
      run: npm run format:check

    - name: 检查代码文件行数
      run: npm run lint:length

    - name: 类型检查
      run: npm run typecheck

  # 构建项目（Next 站点 + 用户脚本产物）+ 单元测试 + 产物校验
  build:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: 安装依赖
      run: npm ci

    - name: 构建项目（Next 站点 + 用户脚本）
      run: npm run build

    - name: 运行单元测试
      run: npm run test:unit

    - name: 验证构建产物
      run: npm run validate

    - name: 上传用户脚本产物
      uses: actions/upload-artifact@v4
      with:
        name: GitHub_zh-cn.user.js
        path: build/GitHub_zh-cn.user.js
        retention-days: 30

  # 集成测试：真实启动 Next 服务，对 API 路由做真实 HTTP 断言
  integration:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: 安装依赖
      run: npm ci

    - name: 构建 Next 站点（供 next start）
      run: npm run build:web

    - name: 运行集成测试
      run: npm run test:integration

  # 安全扫描
  security:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: 安装依赖
      run: npm ci

    - name: 运行安全审计
      run: npm audit --audit-level=high

  # 发布到 GitHub Release（tag 驱动：push vX.Y.Z）
  release:
    runs-on: ubuntu-latest
    needs: [build, integration, security]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: 安装依赖
      run: npm ci

    - name: 构建用户脚本产物
      run: npm run build:userscript

    - name: 校验版本一致性（package.json == CHANGELOG 顶部）
      run: node scripts/check-version-consistency.cjs

    - name: 抽取 Release Notes（从 CHANGELOG 对应版本段落）
      run: node scripts/extract-release-notes.cjs ${{ github.ref_name }}

    - name: 组装发布包
      run: |
        mkdir -p release
        cp build/GitHub_zh-cn.user.js release/
        cp README.md LICENSE release/ 2>/dev/null || true
        cd release
        zip -r ../GitHub_i18n_${{ github.ref_name }}.zip .

    - name: 发布到 GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        body_path: release-notes.md
        files: |
          build/GitHub_zh-cn.user.js
          GitHub_i18n_${{ github.ref_name }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 部署到 GitHub Pages（push main 时）
  deploy-pages:
    runs-on: ubuntu-latest
    needs: [build, integration, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 配置 Pages
      uses: actions/configure-pages@v5

    - name: 上传 Pages 产物
      uses: actions/upload-pages-artifact@v3
      with:
        # 与原 static.yml 行为一致：部署整个仓库到 Pages
        path: '.'

    - name: 部署到 GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

  # 通知
  notify:
    runs-on: ubuntu-latest
    needs: [build, integration, security]
    if: always()
    steps:
    - name: 通知构建结果
      run: |
        if [ "${{ needs.build.result }}" == "success" ] && [ "${{ needs.integration.result }}" == "success" ] && [ "${{ needs.security.result }}" == "success" ]; then
          echo "✅ 构建、集成测试与安全扫描全部通过"
        else
          echo "❌ 存在失败的作业"
          exit 1
        fi
